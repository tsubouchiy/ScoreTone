<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="おんぷクイズ">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>おんぷクイズ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: one centered column, a card holding the staff like a sheet of music paper, answer buttons below */
:root{
  --bg:#eef3f8; --paper:#ffffff; --ink:#1f2a44; --muted:#5b6782; --line:#c9d3e2;
  --easy:#2a9a68; --mid:#2f6bd3; --hard:#7a4bcf; --oni:#b8324b; --accent:var(--mid);
  --ok:#1f9d55; --ng:#d2463c; --okbg:#e3f5ea; --ngbg:#fbe7e5;
  --gold:#e8a317; --rare:#3b8fe0; --super:#d94fa3; --cardbg:#f7f9fc;
  --f-ui:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a26; --paper:#1d2534; --ink:#e8edf6; --muted:#9aa6bd; --line:#34405a;
  --easy:#4cc48e; --mid:#6b9cf0; --hard:#a888ec; --oni:#f07a8c; --ok:#4cc48e; --ng:#f07468; --okbg:#173326; --ngbg:#3a1f1f;
  --gold:#f2b740; --rare:#6aaef0; --super:#ec7cc0; --cardbg:#242e40; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a26; --paper:#1d2534; --ink:#e8edf6; --muted:#9aa6bd; --line:#34405a;
  --easy:#4cc48e; --mid:#6b9cf0; --hard:#a888ec; --oni:#f07a8c; --ok:#4cc48e; --ng:#f07468; --okbg:#173326; --ngbg:#3a1f1f;
  --gold:#f2b740; --rare:#6aaef0; --super:#ec7cc0; --cardbg:#242e40; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-size:1.9rem;font-weight:900;margin:0;text-wrap:balance;letter-spacing:.02em}
h1 .clef{color:var(--accent);margin-right:4px}
h2{font-size:1.4rem;font-weight:900;margin:0}
.sub{color:var(--muted);margin:4px 0 0;line-height:1.6}
.levels{display:flex;flex-direction:column;gap:12px}
.lv{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:14px;
  background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:14px 16px;transition:transform .12s,border-color .12s}
.lv:hover{border-color:var(--c)}
.lv:active{transform:scale(.98)}
.lv:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.lv .badge{width:56px;height:56px;border-radius:14px;background:var(--c);color:#fff;display:grid;place-items:center;font-size:1.6rem;font-weight:900}
.lv b{display:block;font-size:1.15rem}
.lv small{display:block;color:var(--muted);font-size:.85rem;margin-top:2px;line-height:1.5}
.lv .best{font-size:.8rem;color:var(--muted);text-align:right;white-space:nowrap}
.lv .best strong{display:block;font-size:1.1rem;color:var(--gold);letter-spacing:.05em}
.pchip{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:8px;background:var(--paper);
  border:2px solid var(--line);border-radius:999px;padding:5px 14px 5px 6px;font-weight:700;max-width:100%}
.pchip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.pchip .av{width:32px;height:32px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:1.2rem}
.pchip small{color:var(--muted);font-weight:500;font-size:.8rem}
.pbar{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;background:var(--paper);
  border:2px solid var(--accent);border-radius:18px;padding:10px 14px;width:100%}
.pbar:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.pbar .av{width:44px;height:44px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:1.6rem;flex:none}
.pbar .who{flex:1;min-width:0}
.pbar .who small{display:block;color:var(--muted);font-size:.75rem}
.pbar .who b{display:block;font-size:1.2rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbar .chg{flex:none;background:var(--accent);color:#fff;font-weight:700;font-size:.85rem;border-radius:999px;padding:6px 12px}
.hrow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.plist{display:flex;flex-direction:column;gap:10px}
.prow{display:flex;align-items:center;gap:10px;background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:10px 12px}
.prow.cur{border-color:var(--accent)}
.prow .av{width:48px;height:48px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:1.7rem;flex:none}
.prow .who{flex:1;min-width:0}
.prow .who b{display:block;font-size:1.15rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .who small{color:var(--muted);font-size:.8rem}
.mini{all:unset;box-sizing:border-box;cursor:pointer;border-radius:12px;padding:8px 12px;font-weight:700;font-size:.9rem;white-space:nowrap}
.mini.go{background:var(--accent);color:#fff}
.mini.del{color:var(--ng);border:2px solid var(--line)}
.mini.del.sure{background:var(--ng);color:#fff;border-color:var(--ng)}
.mini:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.addbox{background:var(--paper);border:2px dashed var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px}
.addbox label{font-weight:700;font-size:.95rem}
.addbox input{font:inherit;font-size:1.2rem;font-weight:700;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:100%;box-sizing:border-box}
.addbox input:focus{outline:none;border-color:var(--accent)}
.icons{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.icons button{all:unset;box-sizing:border-box;cursor:pointer;aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font-size:1.4rem;border:2px solid transparent;background:var(--bg)}
.icons button[aria-pressed="true"]{border-color:var(--accent);background:var(--paper)}
.icons button:focus-visible{outline:2px solid var(--accent)}
details.addbox{display:block}
.bkin{display:flex;flex-direction:column;gap:12px;margin-top:12px}
details.addbox summary{cursor:pointer;list-style:none}
details.addbox summary::-webkit-details-marker{display:none}
details.addbox summary b::after{content:" ▸";color:var(--muted)}
details.addbox[open] summary b::after{content:" ▾"}
.addbox textarea{font:inherit;font-size:.8rem;font-family:ui-monospace,monospace;padding:8px 10px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:100%;box-sizing:border-box;word-break:break-all;resize:vertical}
.btn.sure{background:var(--ng);color:#fff;border-color:var(--ng)}
.err{color:var(--ng);font-size:.85rem;margin:0;min-height:1.2em}
.ana-btn{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:14px;background:var(--paper);
  border:2px solid var(--line);border-radius:18px;padding:12px 16px}
.ana-btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ana-btn .ic{width:44px;height:44px;border-radius:12px;background:var(--bg);display:grid;place-items:center;flex:none}
.ana-btn b{display:block;font-size:1.05rem}.ana-btn small{color:var(--muted);font-size:.85rem}
.ana-btn .chev{color:var(--muted);font-weight:900}
.ftag{display:inline-block;margin-top:4px;font-size:.72rem;font-weight:700;color:#fff;background:var(--ng);border-radius:999px;padding:1px 8px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:4px}
.seg button{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;border-radius:10px;padding:8px 4px;font-weight:900;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--c,var(--accent));color:#fff}
.seg button:focus-visible{outline:2px solid var(--accent)}
.seg.mode button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.focus{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:14px;background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:12px 16px}
.focus.on{border-color:var(--ng);background:var(--ngbg)}
.focus:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.focus b{display:block;font-size:1.05rem}.focus small{display:block;color:var(--muted);font-size:.8rem;line-height:1.5}
.sw{flex:none;width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;transition:background .2s}
.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.focus.on .sw{background:var(--ng)}.focus.on .sw i{left:23px}
.ana-staff{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:8px 6px;overflow-x:auto}
.ana-staff svg{display:block;width:100%;min-width:300px;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.78rem;color:var(--muted);margin-top:-8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.ana-card{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.ana-card h3{margin:0;font-size:1rem}
.ana-card .sub{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:baseline;gap:8px;border-radius:12px;padding:6px 12px;font-size:.85rem;font-weight:700;font-variant-numeric:tabular-nums}
.chip b{font-size:1.2rem}.chip small{font-size:.7rem}
.chip.ng{background:var(--ngbg);color:var(--ng)}.chip.ok{background:var(--okbg);color:var(--ok)}
.chip.gold{background:color-mix(in srgb,var(--gold) 16%,var(--paper));color:var(--ink)}
.pairs{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.pairs li{display:flex;gap:4px;align-items:baseline;flex-wrap:wrap}.pairs b{font-size:1.1rem}
.pairs span{margin-left:auto;color:var(--muted);font-size:.85rem}
.spark{display:flex;align-items:flex-end;gap:3px;height:70px;border-bottom:1px solid var(--line)}
.spark i{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-width:4px}
.spark i:last-child{background:var(--ink)}
.tblwrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:.85rem;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;color:var(--muted);font-weight:700;font-size:.75rem;padding:4px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td small{color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.ovc{display:inline-block;margin-top:4px;color:var(--gold);font-size:1rem}
.zukan-btn{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:14px;background:var(--paper);
  border:2px dashed var(--gold);border-radius:18px;padding:12px 16px}
.zukan-btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.zukan-btn .peek{display:flex}
.zukan-btn .peek span{font-size:1.7rem;margin-right:-6px}
.zukan-btn b{display:block;font-size:1.05rem}
.zukan-btn small{color:var(--muted);font-size:.85rem}
.meter{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--gold);border-radius:99px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.back{all:unset;cursor:pointer;color:var(--muted);font-weight:700;padding:6px 2px}
.back:focus-visible{outline:2px solid var(--accent)}
.tag{background:var(--accent);color:#fff;border-radius:999px;padding:4px 12px;font-weight:700;font-size:.9rem}
/* melody bar: one segment per question */
.song{display:flex;flex-direction:column;gap:6px}
.song .t{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);font-weight:700}
.song .t b{color:var(--ink)}
.bars{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;align-items:end;height:26px}
.bars i{display:block;border-radius:5px;background:var(--line);height:10px;transition:height .25s,background .25s}
.bars i.now{background:transparent;border:2px solid var(--accent);height:14px}
.bars i.ok{background:var(--accent);height:var(--h)}
.bars i.ng{background:var(--line);opacity:.55}
.bars i.pop{animation:pop .45s ease-out}
@keyframes pop{0%{transform:scaleY(.3)}60%{transform:scaleY(1.25)}100%{transform:scaleY(1)}}
.sheet{background:var(--paper);border-radius:20px;padding:10px 8px;border:2px solid var(--line);position:relative}
.sheet svg{display:block;width:100%;height:auto;max-height:44vh}
.combo{position:absolute;top:10px;right:12px;background:var(--gold);color:#fff;font-weight:900;border-radius:999px;padding:3px 10px;font-size:.85rem}
.q{text-align:center;font-weight:700;font-size:1.1rem;margin:0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.wide{grid-template-columns:1fr}
.opts.wide .opt{min-height:56px;padding:10px 14px;font-size:1.3rem}
.opt{all:unset;box-sizing:border-box;cursor:pointer;background:var(--paper);border:2px solid var(--line);border-radius:16px;position:relative;
  padding:14px 10px;display:flex;align-items:center;gap:10px;font-size:1.35rem;font-weight:900;min-height:64px;min-width:0}
.opt .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-size:.9rem;display:grid;place-items:center}
.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt:not(:disabled):active{transform:scale(.97)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.right .n{background:var(--ok)}
.opt.wrong{border-color:var(--ng);background:var(--ngbg)}
.opt.wrong .n{background:var(--ng)}
.opt:disabled{cursor:default}
.fb{min-height:52px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.fb p{margin:0;font-weight:900;font-size:1.15rem}
.fb p.ok{color:var(--ok)} .fb p.ng{color:var(--ng)}
.btn{all:unset;box-sizing:border-box;cursor:pointer;background:var(--accent);color:#fff;font-weight:900;border-radius:14px;padding:12px 20px;text-align:center}
.btn.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.result{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.score{font-size:3.4rem;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:1.3rem;color:var(--muted)}
.stars{font-size:2.2rem;letter-spacing:.15em;color:var(--gold)}
.stars .off{color:var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.review{width:100%;display:flex;flex-direction:column;gap:6px;text-align:left}
.review div{display:flex;justify-content:space-between;background:var(--paper);border-radius:10px;padding:8px 12px;font-size:.95rem}
.review .x{color:var(--ng);font-weight:700}
.note{color:var(--muted);font-size:.85rem;text-align:center;margin:0}
/* cards */
.card{--rc:var(--line);width:100%;aspect-ratio:3/4;max-width:100%;border-radius:14px;background:var(--cardbg);border:3px solid var(--rc);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;padding:6px;box-sizing:border-box;text-align:center}
.card.r1{--rc:var(--line)} .card.r1 .rs{color:var(--gold)} .card.r2{--rc:var(--rare)} .card.r3{--rc:var(--super);background:linear-gradient(160deg,var(--cardbg),color-mix(in srgb,var(--super) 18%,var(--cardbg)))}
.card .a{font-size:2rem;line-height:1.1;position:relative}
.card .a sub{position:absolute;right:-14px;bottom:-4px;font-size:1.1rem}
.card .nm{font-size:.72rem;font-weight:700;line-height:1.3}
.card .rs{font-size:.7rem;color:var(--rc);letter-spacing:.1em}
.card .cnt{position:absolute;top:4px;right:6px;font-size:.7rem;color:var(--muted);font-weight:700}
.card.unk{border-style:dashed}
.card.unk .a{font-size:1.6rem;color:var(--line);font-weight:900}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (min-width:420px){.grid{grid-template-columns:repeat(4,1fr)}}
.grid h3{grid-column:1/-1;margin:8px 0 0;font-size:1rem}
.reveal{all:unset;cursor:pointer;width:170px;perspective:800px;display:block}
.reveal:focus-visible{outline:3px solid var(--gold);outline-offset:4px;border-radius:16px}
.reveal .in{position:relative;transition:transform .6s;transform-style:preserve-3d}
.reveal.open .in{transform:rotateY(180deg)}
.reveal .face,.reveal .backside{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.reveal .face{position:absolute;inset:0;transform:rotateY(180deg)}
.reveal .face .card .a{font-size:3.6rem}
.reveal .face .card .nm{font-size:.95rem}
.reveal .face .card .rs{font-size:.95rem}
.backside{width:100%;aspect-ratio:3/4;border-radius:14px;background:var(--accent);color:#fff;display:grid;place-items:center;
  font-size:3rem;font-weight:900;animation:wiggle 1.4s ease-in-out infinite}
@keyframes wiggle{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-4deg)}90%{transform:rotate(4deg)}95%{transform:rotate(-2deg)}}
.newtag{color:var(--gold);font-weight:900;font-size:1.1rem;min-height:1.5em;margin:0}
.ring{position:fixed;inset:0;pointer-events:none;z-index:40}
.ring svg{position:absolute;inset:0;width:100%;height:100%}
.ring path{fill:none;stroke-linecap:round}
.ring .track{stroke:var(--line);stroke-width:4;opacity:.6}
.ring .trail{stroke:var(--accent);stroke-width:6;transition:stroke .3s}
.ring.hurry .trail{stroke:var(--ng)}
.ring .runner{position:absolute;left:0;top:0;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;
  display:grid;place-items:center;font-size:1.4rem;font-weight:900;box-shadow:0 2px 8px rgba(0,0,0,.2);will-change:transform}
.ring.hurry .runner{background:var(--ng)}
.safe-probe{position:fixed;visibility:hidden;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.confetti{position:fixed;pointer-events:none;width:8px;height:12px;border-radius:2px;z-index:50;animation:fly .8s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap" id="app"></div>

<script>
const NAMES=["ド","レ","ミ","ファ","ソ","ラ","シ"];
const SEMI=[0,2,4,5,7,9,11];
// diatonic number: octave*7 + letter (C4 = 28)
const nm=d=>NAMES[((d%7)+7)%7];
const LEVELS={
  easy:{label:"やさしい",grade:"小学校 低学年",badge:"易",desc:"ト音記号　まん中のド〜上のド　1もん 6びょう",limit:6,c:"--easy",clefs:"treble"},
  mid:{label:"ふつう",grade:"小学校 高学年",badge:"中",desc:"ト音記号とヘ音記号　低いド〜高いド　♯♭あり",c:"--mid",clefs:"grand"},
  hard:{label:"むずかしい",grade:"チャレンジ",badge:"難",desc:"ヘ音記号の和音　下のラ〜上のミ",c:"--hard",clefs:"bass"},
  oni:{label:"おにムズ",grade:"上級チャレンジ",badge:"鬼",desc:"ヘ音記号の和音　低いド〜上のソ　♯♭あり",c:"--oni",clefs:"bass"}
};
const TOTAL=10;

/* ---------- songs (traditional) : "diatonic:beats" ---------- */

/* ---------- saving ----------
   Everything lives in one small key/value map. It is kept in this browser
   (fast, works offline) and, when the viewer is signed in, in their own
   private document on the server, so it survives browser restarts. */
let KV={};
try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith("onpu-"))KV[k]=localStorage.getItem(k)}}catch(e){}
let saveDoc=null,saving=false,dirty=false,saveTimer=null;
/* second copy in IndexedDB: some browsers clear one kind of storage but not the other */
const IDB={
  db:null,
  open(){if(this.db)return this.db;this.db=new Promise((res,rej)=>{try{const r=indexedDB.open("onpu",1);
    r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});return this.db},
  async get(){const d=await this.open();return new Promise(res=>{try{const q=d.transaction("kv").objectStore("kv").get("all");q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)}catch(e){res(null)}})},
  async put(v){const d=await this.open();return new Promise(res=>{try{const t=d.transaction("kv","readwrite");t.objectStore("kv").put(v,"all");t.oncomplete=()=>res();t.onerror=()=>res()}catch(e){res()}})}
};
let idbTimer=null;
function queueSave(){
  clearTimeout(idbTimer);idbTimer=setTimeout(()=>{IDB.put({...KV}).catch(()=>{})},300);
  if(!saveDoc)return;dirty=true;clearTimeout(saveTimer);saveTimer=setTimeout(flush,400);
}
function replaceKV(obj){
  KV={...obj};
  try{Object.keys(localStorage).filter(k=>k.startsWith("onpu-")).forEach(k=>localStorage.removeItem(k));
    Object.entries(KV).forEach(([k,v])=>localStorage.setItem(k,v))}catch(e){}
}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{})}catch(e){}
async function flush(){
  if(!saveDoc||saving||!dirty)return;
  saving=true;dirty=false;
  try{await saveDoc.set({kv:KV,savedAt:Date.now()})}catch(e){if(e&&e.code==="unavailable")dirty=true}
  saving=false;if(dirty)saveTimer=setTimeout(flush,800);
}
const store={
  get(k){return Object.prototype.hasOwnProperty.call(KV,k)?KV[k]:null},
  set(k,v){v=String(v);if(KV[k]===v)return;KV[k]=v;try{localStorage.setItem(k,v)}catch(e){}queueSave()},
  del(k){if(!(k in KV))return;delete KV[k];try{localStorage.removeItem(k)}catch(e){}queueSave()}
};
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"){clearTimeout(saveTimer);flush()}});
async function connectSave(){
  let changed=false;
  // signed out or not: recover from IndexedDB if this browser lost its other copy
  try{
    const saved=await Promise.race([IDB.get(),new Promise(r=>setTimeout(()=>r(null),1500))]);
    const localHas=getPlayers().length>0;
    if(saved&&!localHas&&saved["onpu-players"]){replaceKV(saved);changed=true}
    else if(localHas)IDB.put({...KV}).catch(()=>{});
  }catch(e){}
  return changed;
}
async function connectServer(){
  try{
    for(let i=0;i<30&&!(window.claude&&window.claude.use);i++)await new Promise(r=>setTimeout(r,100));
    const c=window.claude;if(!c||!c.use)return false;
    const [db,user]=await Promise.all([c.use("db"),c.use("user")]);
    const uid=db&&user?await user.id():null;
    if(!uid)return false;
    const ref=db.doc("data/users/"+uid+"/save");
    const snap=await ref.get();
    saveDoc=ref;
    const remote=snap.exists?(snap.data().kv||{}):null;
    if(remote&&Object.keys(remote).length){
      // the server copy wins; keep it in this browser too
      replaceKV(remote);IDB.put({...KV}).catch(()=>{});
      return true;
    }
    if(Object.keys(KV).length){dirty=true;flush()}   // first time: upload what this browser had
    return false;
  }catch(e){return false}
}

const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};

function drawCard(stars){
  const x=Math.random();
  let tier=stars===3?(x<.25?3:2):stars===2?(x<.05?3:x<.4?2:1):1;
  const owned=getOwned();
  const pool=CARDS.filter(c=>c.r===tier),fresh=pool.filter(c=>!owned[c.id]);
  const src=fresh.length&&Math.random()<.7?fresh:pool;
  const card=src[rnd(src.length)];
  const isNew=!owned[card.id];
  owned[card.id]=(owned[card.id]||0)+1;setOwned(owned);
  return {card,isNew};
}

/* ---------- questions ---------- */
// a note is {d: diatonic number (C4=28), a: -1 flat / 0 / +1 sharp}
const SHARP_OK=[0,1,3,4,5], FLAT_OK=[1,2,4,5,6];  // no E#, B#, Fb, Cb for kids
const accOK=(l,a)=>a===0||(a>0?SHARP_OK:FLAT_OK).includes(l);
const ACC=a=>a>0?"♯":a<0?"♭":"";
const noteName=n=>NAMES[n.d%7]+ACC(n.a);
const pc=(l,a)=>((SEMI[l]+a)%12+12)%12;
const ALLNAMES=[];for(let l=0;l<7;l++)for(const a of[-1,0,1])if(accOK(l,a))ALLNAMES.push({l,a,name:NAMES[l]+ACC(a)});

// natural-note triads (for むずかしい)
const CHORDS=[];
for(let r=0;r<7;r++)for(let inv=0;inv<3;inv++){
  const t=[r,r+2,r+4].map(x=>x%7);
  const order=[...t.slice(inv),...t.slice(0,inv)].map(l=>({l,a:0}));
  CHORDS.push({order,label:order.map(x=>NAMES[x.l]).join("")});
}
// spelled major/minor triads that contain a sharp or flat (for おにムズ)
const ONI=[];
for(let r=0;r<7;r++)for(const ra of[-1,0,1]){
  if(!accOK(r,ra))continue;
  for(const [q3,q5] of [[4,7],[3,7]]){
    const root=pc(r,ra),ls=[r,(r+2)%7,(r+4)%7],want=[root,(root+q3)%12,(root+q5)%12];
    const tones=ls.map((l,i)=>{let a=((want[i]-SEMI[l])%12+12)%12;if(a>6)a-=12;return {l,a}});
    if(tones.some(t=>Math.abs(t.a)>1||!accOK(t.l,t.a)))continue;
    if(!tones.some(t=>t.a))continue;
    for(let inv=0;inv<3;inv++){
      const order=[...tones.slice(inv),...tones.slice(0,inv)];
      ONI.push({order,label:order.map(t=>NAMES[t.l]+ACC(t.a)).join("・")});
    }
  }
}
const pcsKey=o=>o.map(t=>pc(t.l,t.a)).sort((x,y)=>x-y).join(",");

// a shuffled "bag": every item comes out once before any repeats, never the same twice in a row
function fromBag(st,pool,key){
  if(!st.bag||!st.bag.length){
    st.bag=shuffle(pool.slice());
    if(st.bag.length>1&&key(st.bag[st.bag.length-1])===st.lastKey){const t=st.bag.pop();st.bag.unshift(t)}
  }
  const it=st.bag.pop();st.lastKey=key(it);return it;
}
// stack a chord upward and drop it at a random octave that fits inside lo..hi
function placeChord(order,lo,hi){
  const ds=[order[0].l];
  for(let i=1;i<3;i++){let d=ds[i-1]+1;while(d%7!==order[i].l)d++;ds.push(d)}
  const span=ds[2]-ds[0],c=[];
  for(let b=lo;b+span<=hi;b++)if(b%7===order[0].l)c.push(b);
  const base=c[rnd(c.length)];
  return ds.map((d,i)=>({d:d-ds[0]+base,a:order[i].a}));
}
function makeQ(level){
  const forced=focusPick(level);
  if(level==="hard"){
    const pick=(forced&&CHORDS.find(c=>c.label===forced.answer))||fromBag(st,CHORDS,c=>c.label);
    const notes=placeChord(pick.order,19,30);          // A2 .. E4
    const has=new Set(pick.order.map(t=>t.l));
    const near=CHORDS.filter(c=>c.label!==pick.label&&c.order.filter(x=>has.has(x.l)).length>=2);
    const rest=CHORDS.filter(c=>c.label!==pick.label&&!near.includes(c));
    const nNear=rnd(3);
    const others=[...shuffle(near.slice()).slice(0,nNear),...shuffle(rest.slice()).slice(0,3-nNear)].map(c=>c.label);
    return {notes,staff:"bass",answer:pick.label,options:shuffle([pick.label,...others])};
  }
  if(level==="oni"){
    const pick=(forced&&ONI.find(c=>c.label===forced.answer))||fromBag(st,ONI,c=>c.label);
    const notes=placeChord(pick.order,14,32);          // C2 .. G4
    const key=pcsKey(pick.order),seen=new Set([key]),opts=[pick.label];
    const add=o=>{const k=pcsKey(o),lab=o.map(t=>NAMES[t.l]+ACC(t.a)).join("・");
      if(seen.has(k)||opts.includes(lab))return;seen.add(k);opts.push(lab)};
    // same letters, one accidental changed: the trickiest kind of wrong answer
    const vars=[];
    pick.order.forEach((t,i)=>[-1,0,1].forEach(a=>{if(a!==t.a&&accOK(t.l,a)){const o=pick.order.map(x=>({...x}));o[i].a=a;vars.push(o)}}));
    shuffle(vars).slice(0,1+rnd(2)).forEach(add);
    shuffle(ONI.slice()).forEach(c=>{if(opts.length<4)add(c.order)});
    return {notes,staff:"bass",answer:pick.label,options:shuffle(opts)};
  }
  const lo=level==="easy"?28:21, hi=level==="easy"?35:42;
  const pool=[];for(let d=lo;d<=hi;d++)pool.push(d);
  let d,a=0;
  if(forced&&forced.d!==undefined){d=forced.d;a=forced.a}
  else{d=fromBag(st,pool,x=>x);
    if(level==="mid"&&Math.random()<.5){const c=[-1,1].filter(x=>accOK(d%7,x));a=c[rnd(c.length)]}}
  const l=d%7;
  let staff="treble";
  if(level==="mid") staff=d<28?"bass":d>28?"treble":(Math.random()<.5?"treble":"bass");
  const note={d,a},ans=noteName(note);
  let others;
  if(level==="easy"){
    const nb=shuffle([NAMES[(l+1)%7],NAMES[(l+6)%7]]).slice(0,rnd(3));
    others=[...nb,...shuffle(NAMES.filter(x=>x!==ans&&!nb.includes(x)))].slice(0,3);
  }else{
    // same letter with another sign + neighbouring letters, never a same-sounding name
    const apc=pc(l,a),ok=ALLNAMES.filter(n=>n.name!==ans&&pc(n.l,n.a)!==apc);
    const same=shuffle(ok.filter(n=>n.l===l)).slice(0,1+rnd(2));
    const near=shuffle(ok.filter(n=>!same.includes(n)&&(n.l===(l+1)%7||n.l===(l+6)%7)));
    const any=shuffle(ok.filter(n=>!same.includes(n)&&!near.includes(n)));
    others=[...same,...near.slice(0,1+rnd(2)),...any].slice(0,3).map(n=>n.name);
  }
  const order=n=>{const x=ALLNAMES.find(m=>m.name===n)||{l:NAMES.indexOf(n),a:0};return x.l*3+x.a};
  const options=[ans,...others].sort((x,y)=>order(x)-order(y));
  return {notes:[note],staff,answer:ans,options};
}

/* ---------- にがて しらべ: per-player answer statistics ---------- */
// item key: level|answer|d for single notes, level|answer for chords
function getStats(){try{return JSON.parse(store.get(pk("stats"))||"{}")}catch(e){return {}}}
function setStats(o){store.set(pk("stats"),JSON.stringify(o))}
const itemKey=(level,q)=>q.notes.length>1?level+"|"+q.answer:level+"|"+q.answer+"|"+q.notes[0].d;
const recent=it=>{const h=it.h||"";return h.length?[...h].filter(x=>x==="1").length/h.length:0};
const isWeak=it=>it.n>=3&&recent(it)<.7;
function recordAnswer(q,ok,chose,ms,timeout){
  const S=getStats(),k=itemKey(st.level,q);
  const it=S[k]||(S[k]={n:0,c:0,h:"",t:0,to:0,conf:{}});
  it.n++;if(ok)it.c++;it.h=(it.h+(ok?"1":"0")).slice(-10);it.t+=Math.round(ms);
  if(timeout)it.to++;else if(!ok)it.conf[chose]=(it.conf[chose]||0)+1;
  let overcome=false;
  if(it.w&&it.h.endsWith("111")&&recent(it)>=.7){it.w=false;it.ov=(it.ov||0)+1;overcome=true}
  else if(isWeak(it))it.w=true;
  setStats(S);
  return overcome;
}
function levelItems(level){
  const S=getStats(),out=[];
  for(const [k,it] of Object.entries(S)){
    const [lv,answer,d]=k.split("|");if(lv!==level)continue;
    out.push({key:k,answer,d:d===undefined?undefined:+d,...it,acc:recent(it),avg:it.t/it.n/1000});
  }
  return out;
}
function weakItems(level){return levelItems(level).filter(isWeak).sort((x,y)=>x.acc-y.acc)}
const focusOn=level=>store.get(pk("focus-"+level))==="1";
// with the focus switch on, about half the questions come from the weak list
function focusPick(level){
  if(!focusOn(level)||Math.random()>=.5)return null;
  const w=weakItems(level).filter(x=>x.key!==st.lastFocus);
  if(!w.length)return null;
  const it=w[rnd(Math.min(w.length,4))];st.lastFocus=it.key;
  if(it.d===undefined)return {answer:it.answer};
  const n=ALLNAMES.find(m=>m.name===it.answer)||{a:0};
  return {d:it.d,a:n.a};
}
function chordInfo(label){
  const c=CHORDS.find(x=>x.label===label)||ONI.find(x=>x.label===label);if(!c)return {};
  const st1=(c.order[1].l-c.order[0].l+7)%7,st2=(c.order[2].l-c.order[1].l+7)%7;
  return {inv:st1===2&&st2===2?"きほんけい":st1===2?"だい1てんかい":"だい2てんかい",acc:c.order.filter(t=>t.a).length};
}

  const staffs=[];

      <circle cx="12.5" cy="61.5" r="3.4" fill="${ink}" stroke="none"/></g>`);
    else parts.push(`<g transform="translate(22 ${s.top})" stroke="${ink}" stroke-linecap="round">

  const y=d=>s.top+(topLine-d)*H;
  const x=W/2+24;
  const ledgers=new Set();
  for(const {d} of q.notes){
    for(let l=botLine-2;l>=d;l-=2)ledgers.add(l);
    for(let l=topLine+2;l<=d;l+=2)ledgers.add(l);
  }
  for(const l of ledgers)parts.push(`<line x1="${x-15}" x2="${x+15}" y1="${y(l)}" y2="${y(l)}" stroke="${ink}" stroke-width="1.4"/>`);
  // accidentals: top note nearest the head, lower ones step left when they would collide
  const cols=[];

    if(!n.a)return;
    let c=0;while((cols[c]||[]).some(dd=>dd-n.d<5))c++;

  }
  return `<svg viewBox="0 0 ${W} ${h}" role="img" aria-label="ごせんふ">${parts.join("")}</svg>`;
}

let ac=null;
function ctx(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();return ac}catch(e){return null}}
function freq(d,a=0){const oct=Math.floor(d/7),midi=12*(oct+1)+SEMI[d%7]+a;return 440*Math.pow(2,(midi-69)/12)}
function tone(f,t,len,vol,type){
  const a=ctx();if(!a)return;
  const o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.015);
  g.gain.exponentialRampToValueAtTime(.001,t+len);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+len+.05);
}
function play(ds){
  const a=ctx();if(!a)return;const t0=a.currentTime+.02;
  ds.forEach((n,i)=>tone(freq(n.d,n.a),t0+(ds.length>1?i*.05:0),1.4,.22/ds.length+.08,"triangle"));
}
// music-box voice for the melody
function bell(d,t,len){tone(freq(d+7),t,Math.max(.5,len*1.4),.16,"sine");tone(freq(d+14),t,.35,.04,"sine")}
const BEAT=.34;
function playChunks(song,mask,delay=0){
  const a=ctx();if(!a)return 0;
  let first=null,last=0;
  song.notes.forEach(n=>{if(mask(n.chunk)){if(first===null)first=n.t;last=Math.max(last,n.t+n.b)}});
  if(first===null)return 0;
  const t0=a.currentTime+.05+delay;
  song.notes.forEach(n=>{if(mask(n.chunk))bell(n.d,t0+(n.t-first)*BEAT,n.b*BEAT)});
  return (last-first)*BEAT;
}
function playSong(song,okSet){
  const a=ctx();if(!a)return;const t0=a.currentTime+.1;
  song.notes.forEach(n=>{if(okSet.has(n.chunk))bell(n.d,t0+n.t*BEAT,n.b*BEAT)});
}
function fanfare(){const a=ctx();if(!a)return;const t=a.currentTime+.05;[28,30,32,35].forEach((d,i)=>bell(d,t+i*.1,.5))}

function confetti(el){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  const cols=["var(--gold)","var(--accent)","var(--ok)","var(--super)","var(--rare)"];
  for(let i=0;i<16;i++){
    const s=document.createElement("span");s.className="confetti";
    const ang=Math.random()*Math.PI*2,dist=50+Math.random()*70;
    s.style.cssText=`left:${cx}px;top:${cy}px;background:${cols[i%cols.length]};--dx:${Math.cos(ang)*dist}px;--dy:${Math.sin(ang)*dist-30}px;--r:${rnd(540)}deg`;
    document.body.appendChild(s);setTimeout(()=>s.remove(),900);
  }
}

/* あいことば: the save data, compressed when the browser can, as text */
const b64=u8=>{let s="";u8.forEach(b=>s+=String.fromCharCode(b));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")};
const unb64=t=>{t=t.replace(/-/g,"+").replace(/_/g,"/");const s=atob(t);return Uint8Array.from(s,c=>c.charCodeAt(0))};
async function pipe(u8,stream){return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(stream)).arrayBuffer())}
async function makeCode(){
  const obj={};Object.entries(KV).forEach(([k,v])=>{if(k==="onpu-players"||k==="onpu-current"||k.startsWith("onpu-p-"))obj[k]=v});
  const u8=new TextEncoder().encode(JSON.stringify(obj));
  try{if(window.CompressionStream)return "ONPU2-"+b64(await pipe(u8,new CompressionStream("deflate-raw")))}catch(e){}
  return "ONPU1-"+b64(u8);
}
async function readCode(text){
  try{
    const t=String(text).replace(/\s+/g,"");const m=t.match(/^ONPU([12])-([A-Za-z0-9_-]+)$/);if(!m)return null;
    let u8=unb64(m[2]);if(m[1]==="2")u8=await pipe(u8,new DecompressionStream("deflate-raw"));
    const obj=JSON.parse(new TextDecoder().decode(u8));
    if(!obj||typeof obj!=="object"||Array.isArray(obj))return null;
    const out={};
    for(const [k,v] of Object.entries(obj)){if(!/^onpu-/.test(k)||typeof v!=="string"||v.length>200000)return null;out[k]=v}
    const ps=JSON.parse(out["onpu-players"]||"[]");
    if(!Array.isArray(ps)||ps.length>MAXP||ps.some(p=>!p||typeof p.id!=="string"||typeof p.name!=="string"||p.name.length>8||!PICONS.includes(p.icon)))return null;
    return out;
  }catch(e){return null}
}

    <section class="ana-card"><h3>${anaLevel==="hard"||anaLevel==="oni"?"わおん":"おと"} べつ</h3>
      <div class="tblwrap"><table class="tbl"><thead><tr><th>${anaLevel==="hard"||anaLevel==="oni"?"わおん":"おと"}</th><th>かいすう</th><th>さいきん</th><th>ぜんぶ</th><th>へいきん</th><th>よくある まちがい</th></tr></thead><tbody>
      ${items.sort((x,y)=>x.acc-y.acc||y.n-x.n).map(it=>{const top=Object.entries(it.conf||{}).sort((a,b)=>b[1]-a[1])[0];
        return `<tr><td><span class="dot" style="background:${anaColor(it)}"></span>${label(it)}</td><td>${it.n}</td><td>${pct(it.acc)}</td><td>${pct(it.c/it.n)}</td><td>${it.avg.toFixed(1)}s</td><td>${top?top[0]+"（"+top[1]+"）":"—"}${it.to?` <small>じかんぎれ${it.to}</small>`:""}</td></tr>`}).join("")||`<tr><td colspan="6">まだ データが ないよ</td></tr>`}
      </tbody></table></div></section>`;
  const fo=focusOn(anaLevel),nWeak=weakItems(anaLevel).length;
  app.innerHTML=`
    <div class="top"><button class="back" id="back">← もどる</button><span class="tag">${cur().icon} ${esc(cur().name)}</span></div>
    <h2>にがて しらべ</h2>
    <div class="seg" role="tablist" aria-label="レベル">${Object.entries(LEVELS).map(([k,v])=>`<button role="tab" aria-selected="${k===anaLevel}" data-lv="${k}" style="--c:var(${v.c})">${v.badge}</button>`).join("")}</div>
    <p class="sub" style="margin:0">${L.label}：${tot?`ぜんぶで <b>${tot}</b>もん、せいかい <b>${pct(cor/tot)}</b>`:"まだ この レベルを やっていないよ"}</p>
    <button class="focus${fo?" on":""}" id="focus" aria-pressed="${fo}">
      <span class="sw"><i></i></span>
      <span style="flex:1;min-width:0"><b>にがてを おおめに だす</b><small>${fo?(nWeak?`ON：10もん中 半分くらいが にがての ${nWeak}こ から でるよ`:"ON：にがてが できたら おおめに でるよ"):"OFF：ふつうに でるよ"}</small></span></button>
    <div class="seg mode" role="tablist" aria-label="ひょうじ"><button role="tab" aria-selected="${anaMode==="simple"}" data-m="simple">シンプル</button><button role="tab" aria-selected="${anaMode==="detail"}" data-m="detail">くわしく</button></div>
    ${anaMode==="simple"?simple:detail}
    <button class="btn" id="play">${L.label}を あそぶ</button>`;
  document.getElementById("back").onclick=home;
  app.querySelectorAll("[data-lv]").forEach(b=>b.onclick=()=>analysis(b.dataset.lv));
  app.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{anaMode=b.dataset.m;analysis()});
  document.getElementById("focus").onclick=()=>{store.set(pk("focus-"+anaLevel),fo?"0":"1");analysis()};
  document.getElementById("play").onclick=()=>start(anaLevel);
}

function zukan(){
  stopTimer();
  setAccent(null);
  const owned=getOwned(),have=CARDS.filter(c=>owned[c.id]).length;
  const sec=(r,t)=>`<h3>${t}</h3>`+CARDS.filter(c=>c.r===r).map(c=>owned[c.id]?cardHTML(c,owned[c.id]):`<div class="card unk r${c.r}"><div class="a">？</div><div class="rs">${RLABEL[c.r]}</div></div>`).join("");
  app.innerHTML=`
    <div class="top"><button class="back" id="back">← もどる</button><span class="tag" style="background:var(--gold)">${have} / ${CARDS.length}</span></div>
    <h2>どうぶつ がくだん ずかん</h2>
    <p class="sub" style="margin:0">★が おおいほど、レアカードが でやすいよ。★★★なら かならず レア いじょう！</p>
    <div class="grid">${sec(1,"ふつう")}${sec(2,"レア")}${sec(3,"スーパーレア")}</div>`;
  document.getElementById("back").onclick=home;
}

let songBag=[];
function pickSong(){
  const last=store.get("onpu-last-song");
  if(!songBag.length){songBag=shuffle(SONGS.slice());if(songBag[songBag.length-1].title===last)songBag.unshift(songBag.pop())}
  const s=songBag.pop();store.set("onpu-last-song",s.title);return s;
}
function start(level){
  ctx();
  st={level,i:0,score:0,res:[],q:null,done:false,combo:0,song:pickSong()};
  setAccent(level);next();
}
function next(){st.q=makeQ(st.level);st.done=false;render()}
function barsHTML(popIdx){
  // bar heights follow the melody's average pitch in each chunk
  const s=st.song,avg=[];
  for(let k=0;k<TOTAL;k++){const ns=s.notes.filter(n=>n.chunk===k);avg.push(ns.reduce((a,n)=>a+n.d,0)/Math.max(1,ns.length))}
  const lo=Math.min(...avg),hi=Math.max(...avg);
  return avg.map((v,k)=>{
    const h=12+(hi>lo?(v-lo)/(hi-lo):.5)*14;
    const cls=k<st.res.length?(st.res[k].ok?"ok":"ng"):k===st.i?"now":"";
    return `<i class="${cls}${k===popIdx?" pop":""}" style="--h:${h}px"></i>`}).join("");
}
function render(){
  stopTimer();
  const L=LEVELS[st.level],q=st.q;
  app.innerHTML=`
    <div class="top"><button class="back" id="back">← もどる</button><span class="tag">${cur()?cur().icon+" ":""}${L.badge}　${L.label}${focusOn(st.level)?"　にがて とっくん":""}</span></div>
    <div class="song"><div class="t"><span>♪ <b>${st.song.title}</b></span><span>${st.i+1} / ${TOTAL}</span></div>
      <div class="bars" id="bars">${barsHTML()}</div></div>
    <p class="q">${q.notes.length>1?"この わおんは なに？":"この 音は なに？"}</p>
    <div class="sheet">${st.combo>=2?`<span class="combo">${st.combo}れんぞく！</span>`:""}${staffSVG(q,L.clefs)}</div>
    <div class="opts${st.level==="oni"?" wide":""}">${q.options.map((o,k)=>`<button class="opt" id="opt-${k}" data-o="${o}"><span class="n">${k+1}</span><span>${o}</span></button>`).join("")}</div>
    <div class="fb" id="fb"></div>`;
  document.getElementById("back").onclick=home;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(b));
  st.qStart=performance.now();
  if(LEVELS[st.level].limit)startTimer(LEVELS[st.level].limit);
}
function answer(btn){
  if(st.done)return;st.done=true;stopTimer();
  const q=st.q,ok=btn.dataset.o===q.answer;
  app.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(b.dataset.o===q.answer)b.classList.add("right")});
  if(!ok)btn.classList.add("wrong");
  if(ok){st.score++;st.combo++;confetti(btn)}else st.combo=0;
  st.res.push({ok,answer:q.answer,chose:btn.dataset.o});
  const overcome=recordAnswer(q,ok,btn.dataset.o,performance.now()-st.qStart,false);
  document.getElementById("bars").innerHTML=barsHTML(ok?st.i:-1);
  play(q.notes);
  const k=st.i;
  if(ok)playChunks(st.song,c=>c===k,.75);
  const last=st.i===TOTAL-1;
  const cheer=st.combo>=5?"すごい！":st.combo>=3?"いいね！":"せいかい！";
  document.getElementById("fb").innerHTML=`<p class="${ok?"ok":"ng"}">${ok?cheer+(st.combo>=2?` ${st.combo}れんぞく`:""):"ざんねん… こたえは「"+q.answer+"」"}${overcome?`<br><span class="ovc">「${q.answer}」を こくふく！</span>`:""}</p>
    <span class="row"><button class="btn ghost" id="again" aria-label="もう一度きく">♪</button><button class="btn" id="nx">${last?"けっかを見る":"つぎへ →"}</button></span>`;
  document.getElementById("again").onclick=()=>play(q.notes);
  const nx=document.getElementById("nx");nx.focus();
  nx.onclick=()=>{if(last)result();else{st.i++;next()}};
}
function timeUp(){
  if(!st||st.done)return;st.done=true;stopTimer();
  const q=st.q;
  app.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(b.dataset.o===q.answer)b.classList.add("right")});
  st.combo=0;st.res.push({ok:false,answer:q.answer,chose:"じかんぎれ"});
  recordAnswer(q,false,"",performance.now()-st.qStart,true);
  document.getElementById("bars").innerHTML=barsHTML(-1);
  play(q.notes);
  const last=st.i===TOTAL-1;
  document.getElementById("fb").innerHTML=`<p class="ng">じかんぎれ！ こたえは「${q.answer}」</p>`;
  const lvl=st.level,i=st.i;
  st.autoNext=setTimeout(()=>{if(!st||st.level!==lvl||st.i!==i)return;if(last)result();else{st.i++;next()}},1800);
}
/* ---------- time limit: a note runs once around the edge of the screen ---------- */
let tm=null;
function stopTimer(){
  if(st&&st.autoNext){clearTimeout(st.autoNext);st.autoNext=null}
  if(!tm)return;cancelAnimationFrame(tm.raf);removeEventListener("resize",tm.onResize);
  document.removeEventListener("visibilitychange",tm.onVis);tm.el.remove();tm=null;
}
function startTimer(sec){
  stopTimer();
  const el=document.createElement("div");el.className="ring";el.setAttribute("aria-hidden","true");
  el.innerHTML=`<svg><path class="track"/><path class="trail"/></svg><span class="runner">♪</span>`;
  document.body.appendChild(el);
  const svg=el.querySelector("svg"),track=el.querySelector(".track"),trail=el.querySelector(".trail"),runner=el.querySelector(".runner");
  const probe=document.createElement("div");probe.className="safe-probe";document.body.appendChild(probe);
  let len=0;
  function layout(){
    const cs=getComputedStyle(probe),W=innerWidth,H=innerHeight;
    const t=parseFloat(cs.paddingTop)+14,r=parseFloat(cs.paddingRight)+14,b=parseFloat(cs.paddingBottom)+14,l=parseFloat(cs.paddingLeft)+14;
    const R=22,cx=W/2;
    // start at top-centre and go clockwise
    const d=`M${cx} ${t} H${W-r-R} Q${W-r} ${t} ${W-r} ${t+R} V${H-b-R} Q${W-r} ${H-b} ${W-r-R} ${H-b} H${l+R} Q${l} ${H-b} ${l} ${H-b-R} V${t+R} Q${l} ${t} ${l+R} ${t} Z`;
    svg.setAttribute("viewBox",`0 0 ${W} ${H}`);track.setAttribute("d",d);trail.setAttribute("d",d);
    len=trail.getTotalLength();trail.style.strokeDasharray=len;
  }
  layout();probe.remove();
  const T=sec*1000;let start=performance.now(),paused=0,pausedAt=0;
  function layout2(){document.body.appendChild(probe);layout();probe.remove()}
  const onVis=()=>{if(document.hidden)pausedAt=performance.now();else if(pausedAt){paused+=performance.now()-pausedAt;pausedAt=0}};
  function frame(now){
    if(pausedAt){tm.raf=requestAnimationFrame(frame);return}
    const f=Math.min(1,(now-start-paused)/T);
    trail.style.strokeDashoffset=len*(1-f);
    const pt=trail.getPointAtLength(len*f);
    runner.style.transform=`translate(${pt.x}px,${pt.y}px) translate(-50%,-50%) rotate(${f*720}deg)`;
    el.classList.toggle("hurry",f>2/3);
    if(f>=1){timeUp();return}
    tm.raf=requestAnimationFrame(frame);
  }
  tm={el,raf:requestAnimationFrame(frame),onResize:layout2,onVis};
  addEventListener("resize",layout2);document.addEventListener("visibilitychange",onVis);
}
function result(){
  stopTimer();
  const L=LEVELS[st.level],s=st.score;
  const key=pk("best-"+st.level),b=+(store.get(key)??-1);
  const isBest=s>b;if(isBest)store.set(key,s);
  try{const rk=pk("rounds-"+st.level),r=JSON.parse(store.get(rk)||"[]");r.push(s);store.set(rk,JSON.stringify(r.slice(-20)))}catch(e){}
  const stars=starsFor(s);
  const okSet=new Set(st.res.map((r,k)=>r.ok?k:-1));
  const full=s===TOTAL;
  const msg=full?`「${st.song.title}」かんせい！`:s>=7?"よくできました！":s>=4?"もうすこし！":"れんしゅう して もういちど！";
  const me=cur();
  const {card,isNew}=drawCard(st.level==="oni"&&stars>0?Math.min(3,stars+1):stars);
  const miss=st.res.filter(r=>!r.ok);
  app.innerHTML=`
    <div class="top"><button class="back" id="back">← もどる</button><span class="tag">${cur()?cur().icon+" ":""}${L.badge}　${L.label}</span></div>
    <div class="result">
      <div class="stars" aria-label="ほし${stars}こ">${[0,1,2].map(k=>`<span class="${k<stars?"":"off"}">★</span>`).join("")}</div>
      <div class="score">${s}<small> / ${TOTAL}</small></div>
      <p class="q">${msg}${isBest&&s>0?"<br>ベスト きろく！":""}</p>
      <div class="song" style="width:100%"><div class="t"><span>♪ <b>${st.song.title}</b></span><span>${s}/${TOTAL} できた</span></div>
        <div class="bars">${barsHTML()}</div></div>
      <button class="btn ghost" id="songbtn">♪ きょくを きく</button>
      <p class="q" style="margin-top:6px">ごほうびカード</p>
      <button class="reveal" id="reveal" aria-label="カードをひらく"><div class="in">
        <div class="backside">？</div><div class="face">${cardHTML(card,1)}</div></div></button>
      <p class="newtag" id="newtag">タップして ひらこう！</p>
      ${miss.length?`<div class="review">${miss.map(r=>`<div><span>こたえ：<b>${r.answer}</b></span><span class="x">えらんだ：${r.chose}</span></div>`).join("")}</div>`:""}
      <div class="row"><button class="btn" id="retry">もういちど</button><button class="btn ghost" id="menu">レベルをえらぶ</button><button class="btn ghost" id="zk">ずかん</button><button class="btn ghost" id="an">にがて しらべ</button></div>
    </div>`;
  document.getElementById("back").onclick=home;
  document.getElementById("menu").onclick=home;
  document.getElementById("zk").onclick=zukan;
  document.getElementById("an").onclick=()=>analysis(st.level);
  document.getElementById("retry").onclick=()=>start(st.level);
  document.getElementById("songbtn").onclick=()=>playSong(st.song,okSet);
  const rv=document.getElementById("reveal");
  rv.onclick=()=>{
    if(rv.classList.contains("open"))return;
    rv.classList.add("open");fanfare();setTimeout(()=>confetti(rv),300);
    document.getElementById("newtag").textContent=isNew?`NEW！「${card.name}」が なかまに なった！`:`「${card.name}」が もう1まい！`;
  };
  {const sg=st.song;if(full||s>0)setTimeout(()=>playSong(sg,okSet),300)}
}
document.addEventListener("keydown",e=>{
  if(!st||st.done)return;const n=+e.key;
  if(n>=1&&n<=4){const b=document.getElementById("opt-"+(n-1));if(b)answer(b)}
});
// start: show saved players right away if this browser has them, otherwise wait briefly for the server copy
(function boot(){
  curId=store.get("onpu-current");
  const hadLocal=getPlayers().length>0;
  if(hadLocal)start0();
  else app.innerHTML=`<p class="note" style="padding-top:30vh">よみこみ中…</p>`;
  let shown=hadLocal;
  const timer=setTimeout(()=>{if(!shown){shown=true;start0()}},4000);
  connectSave().then(changed=>{
    clearTimeout(timer);
    curId=store.get("onpu-current");
    if(!shown){shown=true;start0();return}
    if(changed&&!st)home();   // refresh the menu with the saved data
  });
})();
</script>
